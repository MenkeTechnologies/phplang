[package]
name = "phplang"
version = "0.2.4"
edition = "2021"
rust-version = "1.80"
description = "PHP as a fusevm frontend: lexer, parser, and compiler to fusevm::Chunk on a PhpHost heap — the first compiled standalone PHP runtime"
license = "MIT"
authors = ["MenkeTechnologies <linux.dev25.com>"]
repository = "https://github.com/MenkeTechnologies/phplang"
homepage = "https://menketechnologies.github.io/phplang/"
documentation = "https://docs.rs/phplang"
readme = "README.md"
keywords = ["php", "interpreter", "compiler", "jit", "fusevm"]
categories = ["command-line-utilities", "compilers"]
publish = true
# Dev-only artifacts kept out of the published crate. Consumers get src + the
# `php` bin — not the CI config, integration-test corpus, or self-test .php
# examples. None are referenced at compile time (no include_str! into them), so
# the packaged crate still builds and its bin runs.
exclude = [
    "/.github/",
    "/tests/",
    "/examples/",
    "/docs/",
    "/scripts/",
    "/BUGS.md",
]

# phplang is a standalone crate, not a workspace member. An explicit empty
# `[workspace]` stops cargo walking up to the MenkeTechnologiesMeta parent.
[workspace]

[lib]
name = "phplang"
path = "src/lib.rs"

[[bin]]
name = "php"
path = "src/main.rs"

# Differential parity FUZZER: generates thousands of seed-deterministic PHP
# snippets and diffs stdout+success of the reference `php` against phplang.
# Development tool (spawns subprocesses only, never links the lib); needs a
# reference `php` on PATH, so CI never runs it. Replay a divergence with
# `parity-fuzz --once --seed <N>`.
[[bin]]
name = "parity-fuzz"
path = "src/bin/parity_fuzz.rs"

# Byte-parity harness over real Drupal 7 procedural functions: extracts each from
# a gitignored Drupal checkout (scripts/fetch-drupal.sh), composes it with a
# driver, and asserts phplang's stdout matches reference `php` byte for byte.
# Development tool — needs `php` on PATH and the checkout, so CI never runs it.
[[bin]]
name = "parity-drupal"
path = "src/bin/parity_drupal.rs"

# Byte-parity harness over real PHP standard-library code: lifts pure-PHP function
# bodies from the Symfony polyfills (a gitignored checkout,
# scripts/fetch-php-polyfill.sh) and asserts phplang's stdout matches reference
# `php` byte for byte. Development tool — needs `php` on PATH and the checkout.
[[bin]]
name = "parity-stdlib"
path = "src/bin/parity_stdlib.rs"

# Offline documentation generator: renders docs/reference.html from the language
# corpus in src/lsp.rs (keywords, constructs, casts, and library functions).
# Links the lib only; needs no reference PHP.
[[bin]]
name = "gen-docs"
path = "src/bin/gen_docs.rs"

[dependencies]
# PHP executes on fusevm. phplang is a pure frontend: it lowers PHP to fusevm
# bytecode (src/compiler.rs) and hosts the PHP object heap (src/host.rs, reached
# from fusevm's registered builtins). Array cells ride through the VM as
# `Value::Obj(u32)` handles into that heap; scalars (int/float/bool/string) are
# native fusevm `Value`s. `jit` turns on fusevm's tracing Cranelift JIT so hot
# PHP arithmetic loops trace-compile, and `jit-disk-cache` persists that native
# code across runs (keyed by chunk hash) so a warm run skips codegen; `aot`
# enables the ahead-of-time object emitter. The strict numeric hook
# (src/builtins.rs) supplies PHP coercion semantics for non-numeric operands.
# `php --tiers` reports which of those tiers a script actually reaches.
fusevm = { version = "0.26.0", features = ["jit", "jit-disk-cache", "aot", "ffi"] }

# Standard-library support crates. PHP-facing behavior is implemented in
# `src/stdlib/*`; these provide the vetted primitives (regex engine, date math,
# hashing/encoding) rather than hand-rolling crypto or a PCRE engine.
regex = "1"
# PCRE has look-around and backreferences; the `regex` crate has neither. A
# pattern using them is compiled by this backtracking engine instead, so
# `preg_match("/foo(?=bar)/", …)` answers rather than failing to compile.
fancy-regex = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
hex = "0.4"
urlencoding = "2"
# Arbitrary-precision decimal arithmetic for the `bcmath` functions.
bigdecimal = "0.4"
num-bigint = "0.4"

# Generators / `yield` are host-side stackful coroutines: a generator function's
# body runs on its own native stack inside a `corosensei::Coroutine`, and `yield`
# suspends it back to the resumer. No fusevm change — the VM run loop simply runs
# on the coroutine's stack, exactly as the sibling node-js frontend does.
corosensei = "0.3"

clap = { version = "4.5", features = ["derive", "cargo"] }
thiserror = "2.0"
rustc-hash = "2.1"
# PHP arrays are ordered maps (insertion order is observable in foreach/print_r).
indexmap = "2"
once_cell = "1"
libc = "0.2"

# Interactive REPL (`php -a` / TTY fallthrough): reedline line editor,
# nu-ansi-term for the banner/status colors. Pins match the sibling frontends.
reedline = "0.47.0"
nu-ansi-term = "0.50"

# `php --lsp` (Language Server) and `php --dap` (Debug Adapter) speak their
# JSON-RPC protocols over stdio. Pins match the sibling frontends (pythonrs).
lsp-server = "0.7.9"
lsp-types = "0.97.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
