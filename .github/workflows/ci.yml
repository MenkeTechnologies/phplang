name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The parity and byte-fuzz snapshots were blessed with the current PHP 8.5
      # patch release; ubuntu-26.04's apt php8.5 is 8.5.4, whose wordwrap($s, k,
      # "|", true) differs. Install the current 8.5 and point the tests at it.
      - name: Install PHP 8.5 (differential-test reference)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          # php.ini-development, as a stock install loads: production sets
          # zend.exception_ignore_args=On, which drops arguments from traces.
          ini-file: development
          # setup-php also loads Microsoft's sqlsrv drivers, which no stock PHP
          # ships. At startup sqlsrv resets the locale from the environment, so
          # under the parity harness's LC_ALL=C LC_CTYPE became "C" and
          # fnmatch('?', '\u00e9') turned byte-wise.
          extensions: :sqlsrv, :pdo_sqlsrv
      - name: Use it as the reference
        run: |
          php --version
          echo "PHP=$(command -v php)" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
